<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI ĐỂU — Local AI</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#09090d;
  color:#fff;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
}
.app{
  width:min(1100px,100%);
  height:100vh;
  display:flex;
  flex-direction:column;
}
.top{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #ffffff12;
  background:#111117;
}
.logo{
  font-size:21px;
  font-weight:900;
}
.logo span{
  color:#ff4f87;
}
.status{
  font-size:12px;
  color:#9999a7;
}
.chat{
  flex:1;
  overflow:auto;
  padding:24px 18px;
}
.msg{
  display:flex;
  margin:14px 0;
}
.user{
  justify-content:flex-end;
}
.bubble{
  max-width:min(800px,85%);
  padding:14px 16px;
  border-radius:18px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}
.bot .bubble{
  background:#15151d;
  border:1px solid #ffffff10;
}
.user .bubble{
  background:#ff4f87;
}
.bottom{
  padding:14px;
  border-top:1px solid #ffffff12;
  background:#101015;
}
.inputRow{
  display:flex;
  gap:10px;
}
input{
  flex:1;
  height:48px;
  border:1px solid #ffffff15;
  outline:none;
  border-radius:14px;
  padding:0 15px;
  background:#18181f;
  color:#fff;
  font-size:15px;
}
button{
  border:0;
  border-radius:14px;
  padding:0 18px;
  background:#ff4f87;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}
button:hover{
  filter:brightness(1.08);
}
.controls{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}
.small{
  height:34px;
  padding:0 12px;
  background:#1a1a22;
  font-size:12px;
}
.progress{
  height:3px;
  width:100%;
  background:#202029;
  margin-top:10px;
  overflow:hidden;
  border-radius:999px;
}
.progress span{
  display:block;
  height:100%;
  width:0;
  background:#ff4f87;
  transition:.2s;
}
.badge{
  font-size:11px;
  color:#7dd3fc;
}
@media(max-width:700px){
  .status{display:none}
  .bubble{max-width:92%}
  .inputRow button{padding:0 14px}
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">🤖 AI <span>ĐỂU</span></div>
    <div class="status" id="status">Chưa tải model</div>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">
      <div class="bubble">
        Xin chào 😏

        Tôi là AI ĐỂU chạy trực tiếp trên máy của bạn.
        Không Gemini API.
        Không API key.
        Không cần server AI.

        Lần đầu sẽ tải model về máy.
      </div>
    </div>
  </div>

  <div class="bottom">

    <div class="inputRow">
      <input
        id="input"
        placeholder="Nhập tin nhắn..."
        autocomplete="off"
      >
      <button id="send">GỬI</button>
    </div>

    <div class="controls">

      <button class="small" id="load">
        🧠 TẢI AI
      </button>

      <button class="small" id="learn">
        🎓 HỌC
      </button>

      <button class="small" id="test">
        🧪 TỰ TEST
      </button>

      <button class="small" id="clear">
        🗑 XÓA NHỚ
      </button>

      <span class="badge" id="memoryCount">
        Memory: 0
      </span>

    </div>

    <div class="progress">
      <span id="bar"></span>
    </div>

  </div>

</div>

<script type="module">

import {
  CreateMLCEngine
} from "https://esm.run/@mlc-ai/web-llm";


/* =========================
   MODEL
========================= */

const MODEL =
  "SmolLM2-360M-Instruct-q4f16_1-MLC";


/* =========================
   STATE
========================= */

let engine = null;

let loading = false;

let messages = [
  {
    role:"system",
    content:
      "Bạn là AI ĐỂU, một chatbot tiếng Việt thân thiện, nhanh, tự nhiên, có chút hài hước. Trả lời đúng trọng tâm. Không tự nhận là ChatGPT."
  }
];

let memory =
  JSON.parse(
    localStorage.getItem("ai_deu_memory") || "[]"
  );


/* =========================
   DOM
========================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("send");

const loadBtn =
  document.getElementById("load");

const learnBtn =
  document.getElementById("learn");

const testBtn =
  document.getElementById("test");

const clearBtn =
  document.getElementById("clear");

const status =
  document.getElementById("status");

const bar =
  document.getElementById("bar");

const memoryCount =
  document.getElementById("memoryCount");


/* =========================
   MEMORY
========================= */

function saveMemory(){

  localStorage.setItem(
    "ai_deu_memory",
    JSON.stringify(memory)
  );

  memoryCount.textContent =
    "Memory: " + memory.length;
}

saveMemory();


function addMemory(text){

  text = text.trim();

  if(!text) return;

  if(memory.includes(text)) return;

  memory.push(text);

  if(memory.length > 500){
    memory.shift();
  }

  saveMemory();
}


/* =========================
   UI
========================= */

function setStatus(text){

  status.textContent = text;

}


function addMessage(type,text){

  const row =
    document.createElement("div");

  row.className =
    "msg " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent = text;

  row.appendChild(bubble);

  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;

  return bubble;
}


/* =========================
   LOAD MODEL
========================= */

async function loadAI(){

  if(engine || loading) return;

  if(!navigator.gpu){

    setStatus(
      "❌ Trình duyệt không hỗ trợ WebGPU"
    );

    alert(
      "Máy/trình duyệt này không hỗ trợ WebGPU."
    );

    return;
  }

  loading = true;

  loadBtn.disabled = true;

  setStatus("🧠 Đang tải AI...");

  try{

    engine = await CreateMLCEngine(
      MODEL,
      {

        initProgressCallback:
          function(progress){

            const value =
              Math.max(
                0,
                Math.min(
                  100,
                  Math.round(
                    progress.progress * 100
                  )
                )
              );

            bar.style.width =
              value + "%";

            setStatus(
              progress.text || "Đang tải..."
            );

          }

      }
    );

    bar.style.width = "100%";

    setStatus(
      "✅ AI đã sẵn sàng"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Không tải được model"
    );

    alert(error.message);

  }finally{

    loading = false;

    loadBtn.disabled = false;

  }

}


/* =========================
   MEMORY CONTEXT
========================= */

function getMemory(){

  if(!memory.length)
    return "";

  return (
    "\n\nKIẾN THỨC NHỚ ĐƯỢC:\n" +
    memory
      .slice(-30)
      .map((x,i)=>`${i+1}. ${x}`)
      .join("\n")
  );
}


/* =========================
   CHAT
========================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  if(!engine){

    await loadAI();

    if(!engine)
      return;
  }

  input.value = "";

  addMessage(
    "user",
    text
  );

  messages.push({
    role:"user",
    content:text
  });

  const bubble =
    addMessage(
      "bot",
      "..."
    );

  try{

    const fullMessages = [

      messages[0],

      {
        role:"system",
        content:getMemory()
      },

      ...messages.slice(1)

    ];

    const stream =
      await engine.chat.completions.create({

        messages: fullMessages,

        temperature:0.7,

        top_p:0.9,

        max_tokens:700,

        stream:true

      });

    let answer = "";

    bubble.textContent = "";

    for await(
      const chunk of stream
    ){

      const token =
        chunk.choices?.[0]
          ?.delta
          ?.content || "";

      answer += token;

      bubble.textContent =
        answer;

      chat.scrollTop =
        chat.scrollHeight;

    }

    messages.push({
      role:"assistant",
      content:answer
    });


    /*
      TỰ HỌC:
      lưu lại những đoạn có vẻ hữu ích
    */

    if(
      text.length > 8 &&
      answer.length > 20
    ){

      addMemory(
        "Người dùng hỏi: " +
        text +
        " | AI trả lời: " +
        answer
      );

    }

    setStatus(
      "✅ Đã trả lời"
    );

  }catch(error){

    console.error(error);

    bubble.textContent =
      "Lỗi: " + error.message;

    setStatus(
      "❌ Lỗi AI"
    );

  }

}


/* =========================
   SIMPLE SELF-TEST
========================= */

async function selfTest(){

  if(!engine){

    await loadAI();

    if(!engine) return;

  }

  setStatus(
    "🧪 AI đang tự test..."
  );


  const tests = [

    "2 + 2 bằng bao nhiêu?",

    "HTML là gì?",

    "CSS dùng để làm gì?",

    "JavaScript là gì?",

    "Việt Nam nằm ở châu lục nào?"

  ];


  for(const question of tests){

    try{

      const result =
        await engine.chat.completions.create({

          messages:[
            {
              role:"system",
              content:
                "Trả lời ngắn gọn và chính xác."
            },
            {
              role:"user",
              content:question
            }
          ],

          temperature:0.2,

          max_tokens:120

        });

      const answer =
        result.choices?.[0]
          ?.message
          ?.content || "";

      addMemory(
        "SELF-TEST: " +
        question +
        " => " +
        answer
      );

    }catch(error){

      console.error(error);

    }

  }

  setStatus(
    "✅ Tự test xong"
  );

}


/* =========================
   TRAIN / LEARN
========================= */

function learnSomething(){

  const text =
    prompt(
      "Nhập kiến thức muốn AI ghi nhớ:"
    );

  if(!text) return;

  addMemory(text);

  setStatus(
    "🎓 Đã học kiến thức mới"
  );

  addMessage(
    "bot",
    "Đã ghi nhớ:\n" + text
  );

}


/* =========================
   EVENTS
========================= */

sendBtn.onclick =
  sendMessage;

loadBtn.onclick =
  loadAI;

learnBtn.onclick =
  learnSomething;

testBtn.onclick =
  selfTest;

clearBtn.onclick =
  function(){

    if(
      confirm(
        "Xóa toàn bộ memory?"
      )
    ){

      memory = [];

      saveMemory();

      addMessage(
        "bot",
        "Đã xóa bộ nhớ."
      );

    }

  };


input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   AUTO SELF TEST
========================= */

/*
  Khi trang đang mở,
  AI tự test khoảng 10 phút/lần.
*/

setInterval(
  function(){

    if(
      document.visibilityState ===
      "visible" &&
      engine &&
      !loading
    ){

      selfTest();

    }

  },
  10 * 60 * 1000
);


/* =========================
   AUTO LOAD
========================= */

window.addEventListener(
  "load",
  function(){

    setTimeout(
      loadAI,
      500
    );

  }
);

</script>

</body>
</html>
